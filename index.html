<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>소크라테스 패러독스</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #050505; color: #fff; }
    body { min-width: 280px; }
    /* 별도 상단 바: 스크롤 시 사진 위에 겹치지 않습니다. */
    .topbar {
      position: relative;
      width: 100%;
      min-height: 64px;
      padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
      background: #0b0b0b;
      border-bottom: 1px solid #282828;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .audio-controls { display: flex; align-items: center; gap: 12px; }
    .audio-controls button {
      width: 40px; height: 40px;
      border: 1px solid #454545; border-radius: 50%;
      background: #181818; color: #fff;
      display: grid; place-items: center;
      cursor: pointer; touch-action: manipulation;
    }
    .audio-controls button:hover { background: #303030; }
    .audio-controls button:focus-visible, .audio-controls input:focus-visible, .ticket:focus-visible {
      outline: 2px solid #b5ff39; outline-offset: 3px;
    }
    .audio-controls svg { width: 18px; height: 18px; fill: currentColor; }
    .audio-controls .volume-label { font-size: 12px; font-weight: 650; letter-spacing: .1em; }
    .audio-controls input { width: 110px; height: 22px; margin: 0; accent-color: #b5ff39; cursor: pointer; }
    main { width: 100%; }
    .photo { position: relative; line-height: 0; }
    .photo img { width: 100%; height: auto; display: block; }
    .ticket {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 90px; height: 64px;
      border-radius: 19px; background: #f00; color: #fff;
      box-shadow: 0 4px 30px #0009;
      display: grid; place-items: center;
      transition: transform .2s, background .2s;
    }
    .ticket:hover { transform: translate(-50%, -50%) scale(1.12); background: #e00000; }
    .ticket svg { width: 37px; height: 37px; fill: currentColor; }
    @media (max-width: 500px) {
      .topbar { min-height: 58px; padding-top: 8px; padding-bottom: 8px; }
      .audio-controls { gap: 9px; }
      .audio-controls button { width: 38px; height: 38px; }
      .audio-controls input { width: 88px; }
      .ticket { width: 66px; height: 48px; border-radius: 13px; }
      .ticket svg { width: 27px; height: 27px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="audio-controls" role="group" aria-label="배경음악 컨트롤">
      <button id="toggle" type="button" aria-label="음악 재생" title="음악 재생">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="control-icon-path" d="M8 5v14l11-7z"/></svg>
      </button>
      <label class="volume-label" for="volume">VOL</label>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.55" aria-label="음악 볼륨">
    </div>
  </header>

  <audio id="bgm" src="music.mp3" autoplay loop preload="auto" playsinline></audio>

  <main>
    <section class="photo">
      <img src="1.png" alt="소크라테스 패러독스 공연 사진 1" fetchpriority="high">
      <a class="ticket" href="https://nol.yanolja.com/ticket/products/26010086" target="_blank" rel="noopener noreferrer" aria-label="티켓 예매 페이지 열기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </a>
    </section>
    <section class="photo"><img src="2.png" alt="소크라테스 패러독스 공연 사진 2" loading="lazy"></section>
    <section class="photo"><img src="3.png" alt="소크라테스 패러독스 공연 사진 3" loading="lazy"></section>
    <section class="photo"><img src="4.png" alt="소크라테스 패러독스 공연 사진 4" loading="lazy"></section>
  </main>

  <script>
    const audio = document.getElementById('bgm');
    const toggle = document.getElementById('toggle');
    const volume = document.getElementById('volume');
    const controlIconPath = document.getElementById('control-icon-path');

    audio.volume = Number(volume.value);

    function syncControls() {
      const playing = !audio.paused;
      // 유튜브 방식: 음악 재생 중엔 일시정지(Ⅱ), 정지 중엔 재생(▶) 하나만 표시합니다.
      controlIconPath.setAttribute('d', playing
        ? 'M6 4h4v16H6zM14 4h4v16h-4z'
        : 'M8 5v14l11-7z');
      toggle.setAttribute('aria-label', playing ? '음악 일시정지' : '음악 재생');
      toggle.title = playing ? '음악 일시정지' : '음악 재생';
    }

    toggle.addEventListener('click', async () => {
      if (audio.paused) {
        try { await audio.play(); }
        catch (error) { console.warn('브라우저에서 음악 재생을 차단했습니다.', error); }
      } else {
        audio.pause();
      }
      syncControls();
    });

    volume.addEventListener('input', () => {
      audio.volume = Number(volume.value);
    });

    audio.addEventListener('play', syncControls);
    audio.addEventListener('pause', syncControls);
    audio.addEventListener('ended', syncControls);

    // 브라우저가 소리 있는 자동재생을 허용하면 바로 시작합니다.
    // 모바일 브라우저에서 차단하면 사용자가 재생 버튼을 눌러야 합니다.
    audio.play().catch(() => syncControls());
    syncControls();
  </script>
</body>
</html>
